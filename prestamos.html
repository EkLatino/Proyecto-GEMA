<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prestamos</title>
    <link rel="stylesheet" href="css/styleGeneral.css">
</head>
<body>
    <header class="topbar">
        <img src="imagesProject/gemaLogo.png" alt="logo">
    </header>
    
    <main class="contenido">

        <div class="card-login">  <!-- reusamos la misma clase de tarjeta del login -->
    
            <h1>Solicitud de Préstamo</h1>
    
            <form id="prestamoForm">

                <div class="campo">
                    <label for="solicitante">Nombre del solicitante</label>
                    <input type="text" id="solicitante" name="solicitante" placeholder="Ingrese su nombre completo" required>
                </div>
    
                <div class="campo">
                    <label for="correo">Correo</label>
                    <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" required>
                </div>
                
                <div class="campo">
                    <label for="herramienta">Herramienta</label>

                    <select id="herramienta" name="herramienta" required>
                        <option value="">-- Seleccione una herramienta --</option>
                        <option value="mira-topografica">Mira Topográfica</option>
                        <option value="nivel-optico">Nivel Óptico</option>
                        <option value="teodolito">Teodolito</option>
                        <option value="prisma-topografica">Prisma Topográfica</option>
                        <option value="bastones-topograficos">Bastones Topográficos</option>
                        <option value="escaner-láser-en-3D">Escaner Láser en 3D</option>
                        <option value="distanciometro-laser">Distanciometro Láser</option>
                        <option value="gnss-rtk">GNSS RTK</option>
                        <option value="plomada">Plomada</option>
                        <option value="estacion-total">Estación Total</option>
                        <option value="dron-topografico">Dron Topográfico</option>
                        <option value="plomada">Plomada</option>
                    </select>

                </div>
                
                <div class="campo">
                    <label for="cantidad">Cantidad</label>
                    <input type="number" id="cantidad" name="cantidad" min="1" value="1" required>
                </div>
                
                <div class="campo">
                    <label for="fechaPrestamo">Fecha de préstamo</label>
                    <input type="date" id="fechaPrestamo" name="fechaPrestamo" required>
                </div>

                <div class="campo">
                    <label for="fechaDevolucion">Fecha estimada de devolución</label>
                    <input type="date" id="fechaDevolucion" name="fechaDevolucion" required>
                </div>
                
                <div class="campo">
                    <label for="observaciones">Observaciones (opcional)</label>
                    <textarea id="observaciones" name="observaciones" rows="5" placeholder="Motivo o proyecto en el que se usará..."></textarea>
                </div>

                <div class="campo">
                    <a href="registro.html" class="boton-prestamo">
                        Solicitar Préstamo
                    </a>
                </div>

                <p id="mensajeConfirmacion" class="mensaje-error" style="display: none;"></p>
    
            </form>
    
        </div>
    
    </main>
    
</body>
</html>
